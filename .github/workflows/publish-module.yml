# Publishes the SpacetimeDB module.
#
#   push to main touching spacetimedb/  ->  closetkeeper-dev   (environment: dev)
#   push of a v* tag                    ->  closetkeeper       (environment: prod)
#
# Production never receives --delete-data. The CLI refuses a non-interactive
# publish that would require a migration or data deletion unless that flag is
# passed (verified 2026-09-05, see docs/decision-log.md), so an incompatible
# schema change fails this job and leaves production untouched. Handle such a
# change deliberately; do not "fix" it by adding the flag here.
#
# Dev holds no real data, so it passes --delete-data=on-conflict and wipes
# itself rather than blocking on a conflicting change. That only covers
# schema conflicts: init runs once per database, so when what init seeds
# changes (a role key, say), dev keeps the old rows until it is recreated.
# Run this workflow by hand with "Recreate the dev database" checked to wipe
# and reseed it. Nothing is deployed from a terminal.
#
# Each environment needs the SPACETIMEDB_TOKEN secret for an identity that
# owns its database. The prod environment is restricted to v* tags in the
# repository settings, so a branch build cannot reach it even by mistake.

name: Publish module

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - spacetimedb/**
      - .github/workflows/publish-module.yml
  workflow_dispatch:
    inputs:
      recreate_dev:
        description: "Recreate the dev database (wipes it and reruns init)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dev:
    name: Publish to closetkeeper-dev
    # A manual run only ever targets dev; the prod job is tag-only below.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Log in
        run: spacetime login --token "$SPACETIMEDB_TOKEN"
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
      - name: Publish
        # A manual run with recreate_dev checked wipes dev outright so init
        # reseeds it. Every other run wipes only on a schema conflict.
        env:
          DELETE_DATA: ${{ inputs.recreate_dev == true && 'always' || 'on-conflict' }}
        run: >
          spacetime publish closetkeeper-dev
          --server maincloud
          --module-path spacetimedb
          --delete-data="$DELETE_DATA"
          --yes=remote,skip-login,break-clients,delete-data

      - name: Invite the first staff member
        # Optional. BOOTSTRAP_STAFF_EMAIL is a repository secret so a different
        # deployer seeds their own address without it ever appearing in code.
        # The publisher identity (this token) is seeded as staff by init, so it
        # is authorized to invite. The reducer is idempotent.
        if: env.EMAIL != ''
        env:
          EMAIL: ${{ secrets.BOOTSTRAP_STAFF_EMAIL }}
        run: >
          spacetime call closetkeeper-dev --server maincloud
          invite_staff "\"$EMAIL\"" '"Maintainer"' '"system_admin"'

  prod:
    name: Publish to closetkeeper (production)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    concurrency:
      group: publish-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Log in
        run: spacetime login --token "$SPACETIMEDB_TOKEN"
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
      - name: Publish
        # No --delete-data, ever. See the header comment.
        run: >
          spacetime publish closetkeeper
          --server maincloud
          --module-path spacetimedb
          --yes=remote,skip-login,break-clients

      - name: Invite the first staff member
        if: env.EMAIL != ''
        env:
          EMAIL: ${{ secrets.BOOTSTRAP_STAFF_EMAIL }}
        run: >
          spacetime call closetkeeper --server maincloud
          invite_staff "\"$EMAIL\"" '"Maintainer"' '"system_admin"'

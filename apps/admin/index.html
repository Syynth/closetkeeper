<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!--
			viewport-fit=cover is what makes env(safe-area-inset-*) report real
			numbers on a notched phone. Without it the tab bar's safe-area
			padding is silently zero and the bar sits under the home indicator.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="robots" content="noindex, nofollow" />
		<!-- The browser chrome matches the page instead of framing it in white. -->
		<meta name="theme-color" content="#f3f4f1" />
		<meta name="color-scheme" content="light" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Closetkeeper" />
		<title>Closetkeeper</title>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
